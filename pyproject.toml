[project]
name = "python-plot-gallery"
version = "0.1.0"
description = "Reproducible Python data visualization gallery: content, pipeline and website."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]

[project.scripts]
gallery = "plot_gallery.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives in pipeline/plot_gallery instead of the default src/ layout
module-root = "pipeline"
module-name = "plot_gallery"

[tool.gallery]
repo_owner = "neisserale"
repo_name = "python-plot-gallery"
repo_branch = "main"
dpi = 200
figure_size = [8, 6]
image_tolerance = 2.0
render_timeout_s = 60
cell_timeout_s = 120
max_dataset_mb = 5

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["plot_gallery"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
notebooks = [
    "jupyterlab>=4.6.4",
]
